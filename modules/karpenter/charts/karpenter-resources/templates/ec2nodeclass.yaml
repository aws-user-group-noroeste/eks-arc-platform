apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: runners
spec:
  role: {{ .Values.nodeIamRoleName }}
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName }}
