apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-secret
  namespace: {{ .Values.runnerNamespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: github-app-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secretName }}
