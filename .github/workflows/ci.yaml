name: Terraform CI

# Runs Terraform formatting, validation, and tests on the self-hosted ARC
# runner scale set provisioned by this repository. This serves as both the
# CI gate and an end-to-end validation that the self-hosted runners work.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
          # ARC runner images don't expose node on the PATH for run steps;
          # disable the Node.js wrapper so terraform is called directly.
          terraform_wrapper: false

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend)
        # Validation does not need remote state; skip backend init so CI
        # never touches the real state bucket.
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform test
        # The two deployment-only variables have no defaults; supply dummy
        # values so the mock-provider test suite can plan. These never reach
        # AWS (tests use mock_provider + override_module).
        env:
          TF_VAR_terraform_execution_role_arn: "arn:aws:iam::123456789012:role/test-exec"
          TF_VAR_cluster_admin_arn: "arn:aws:iam::123456789012:role/test-admin"
        run: terraform test
